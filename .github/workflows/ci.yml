
name: KubeManager CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kubemanager_rag
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kubemanager_rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      RAG_DATASOURCE_USERNAME: postgres
      RAG_DATASOURCE_PASSWORD: postgres
      GEMINI_API_KEY: ci-placeholder-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize application databases
        env:
          PGPASSWORD: postgres
        run: |
          for database in kubemanager_auth kubemanager_user kubemanager_cluster kubemanager_ai; do
            psql -h localhost -U postgres -d postgres \
              -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE $database;"
          done

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
